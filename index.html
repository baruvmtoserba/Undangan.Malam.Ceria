<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Undangan Digital</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <!-- Cover -->
  <div id="cover">
    <img src="cover.png" alt="Cover Undangan">
    <div class="namabuka">
      <p>Kepada Yth. <br> Bapak/Ibu/Sdr/i</p>
      <h2 id="namaCover">Nama Tamu</h2>
      <button onclick="bukaUndangan()">✉ Buka Undangan</button>
    </div>
  </div>

  <div class="undangan">
    <img src="Undangan.png" alt="Undangan" class="bg">

    <div class="info">
      <h2 id="nama">Nama Tamu</h2>
      <img id="qr" src="" alt="QR Code">
      <h2>No. ID</h2>
      <h2 id="nomorID">Nomor ID</h2>
    </div>

    <!-- Musik -->
    <audio id="musik" preload="auto">
      <source src="Musik.MP3" type="audio/mpeg">
    </audio>

  </div>

  <!-- Map -->
  <div class="map-container">
    <h3>Lokasi Acara</h3>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d988.2444033246771!2d110.90591988594176!3d-7.792194665826143!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e7a2fbbfa5b9b13%3A0xb498ece7fa04066d!2sGraha%20Sasono%20Mulyo!5e0!3m2!1sen!2sid!4v1759217865012!5m2!1sen!2sid"
      width="100%" height="300" style="border:0; border-radius:12px;" allowfullscreen loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>



  <script src="script.js"></script>
</body>

</html>
